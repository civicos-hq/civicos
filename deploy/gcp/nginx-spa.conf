# Static host for the two Vite SPAs (citizen web, admin console).
#
# Cloud Run routes to the container's port; 8080 is its default and the
# deploy pins --port=8080, so nginx can listen on a fixed port rather than
# templating $PORT at startup.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router owns the URL space: any path that isn't a real file must
    # return index.html rather than 404, or a deep link like /issues/123
    # breaks on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints asset filenames, so they can be cached indefinitely.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The entry document must never be cached, or browsers keep loading an
    # old build that references deleted asset hashes.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
