# Static host for the Docusaurus documentation site.
#
# Unlike the SPAs, Docusaurus emits a real HTML file per route, so there is no
# catch-all rewrite: an unknown path should 404 through its own 404.html
# rather than silently render the homepage.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Try the path, then the directory index, then hand off to the
        # generated 404 page.
        try_files $uri $uri/ $uri.html $uri/index.html /404.html;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
