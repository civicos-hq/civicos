openapi: 3.0.3
info:
  title: CivicOS Organization Service
  version: 1.0.0
  description: |
    Organizations (registry + membership), announcements, projects, issue
    assignments ("receive reports"), and progress updates ("respond publicly",
    "update progress").

    All routes are proxied by the API gateway at `/api/v1/*`. The service
    itself mounts them under `/v1/*`.

    ## Authorization model

    Roles allowed to **create** a top-level org from scratch: `GOVERNMENT_ADMIN`,
    `PLATFORM_ADMIN`, `NGO`. Once created, the org's internal role
    (`OWNER` / `ADMIN` / `STAFF`) governs edits — not the platform JWT role.

    **Content-authorship writes are strictly org-only.** A `PLATFORM_ADMIN`
    who is not a member of the org **cannot** create, edit, publish, or
    delete announcements / projects / assignments / consultations on the
    org's behalf. Attribution belongs to the organization itself.

    Platform admins retain two narrow powers:

    - **Emergency close/archive** — `PLATFORM_ADMIN` can close a published
      consultation or archive an announcement without joining the org first.
      Written to the audit log with the actor's identity.
    - **Oversight reads** — `PLATFORM_ADMIN` can view responses, analytics,
      and org-only content (draft announcements, assignment inboxes) for
      any org.

    Anything beyond these two levers requires the platform admin to be
    added as a member of the target org first.

servers:
  - url: http://localhost:3000/api/v1
    description: Local (via API Gateway)
  - url: http://localhost:3003/v1
    description: Direct to organization-service

tags:
  - name: Organizations
    description: Registry and membership.
  - name: Funding Analytics
    description: >
      Read-only aggregates over campaigns and the donation ledger. Money shown
      is what settled THROUGH CivicOS, which is not what an organization holds,
      has spent, or has left.
  - name: Members
    description: Organization member management.
  - name: Announcements
    description: Public announcements from an organization.
  - name: Projects
    description: Ongoing organization projects with status and budget.
  - name: Assignments
    description: Issue → organization assignments (an org takes responsibility for a report).
  - name: Progress Updates
    description: Public updates on an assigned issue or a project.
  - name: Consultations
    description: Structured feedback asks with a full lifecycle (DRAFT → PUBLISHED → CLOSED) and outcome publishing.
  - name: Consultation Questions
    description: Question builder for draft consultations (only editable while status = DRAFT).
  - name: Consultation Responses
    description: Verified-user response submission and admin-only response reads.
  - name: Consultation Outcomes
    description: Post-close outcome publishing — the "close the loop" primitive.
  - name: Campaigns
    description: |
      Community Funding campaigns. Phase 1 of the funding module: campaign
      authoring, the milestone spend plan, and the verification lifecycle.
      There are **no public routes and no payment endpoints yet** — see
      docs/product/community-funding-plan.md for the phase order and why
      transparency ships before money.
  - name: Milestones
    description: A campaign's spend plan. Editable only while the campaign is DRAFT or NEEDS_CHANGES.
  - name: Donations
    description: |
      Community Funding donations (Phase 3), powered by Paystack.

      **CivicOS is not the merchant of record.** Each organization connects
      its own Paystack sub-account and Paystack settles directly to it —
      CivicOS never holds funds. These endpoints orchestrate and record;
      they do not move money on anyone's behalf.

      All amounts are integer minor units (kobo for NGN). No endpoint here
      accepts or returns a decimal.

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      required: [success, code, message]
      properties:
        success: { type: boolean, example: false }
        code: { type: string, example: VALIDATION_ERROR }
        message: { type: string }

    OrgKind:
      type: string
      description: |
        `REPRESENTATIVE_OFFICE` is the constituency office of an elected
        representative. It cannot be set through `PATCH /organizations/{id}` —
        offices are created only by `POST /me/representative-office`, which
        requires a claimed representative profile and records the link.
      enum: [GOVERNMENT, AGENCY, NGO, UTILITY, OTHER, REPRESENTATIVE_OFFICE]
    OrgJurisdiction:
      type: string
      enum: [NATIONAL, STATE, LGA, COMMUNITY]
    OrgMemberRole:
      type: string
      enum: [OWNER, ADMIN, STAFF]
    AnnouncementStatus:
      type: string
      enum: [DRAFT, PUBLISHED, ARCHIVED]
    ProjectStatus:
      type: string
      enum: [PLANNED, ACTIVE, PAUSED, COMPLETED, CANCELLED]
    AssignmentStatus:
      type: string
      enum: [RECEIVED, IN_PROGRESS, COMPLETED, REJECTED]
    CampaignStatus:
      type: string
      description: |
        Campaign lifecycle. Adds NEEDS_CHANGES / REJECTED / PAUSED to the
        product spec's diagram, which had no failure states despite its own
        Governance section requiring a pause. FUNDED is set by the platform
        from settled donations (Phase 3) and cannot be asserted by a user.
      enum:
        [
          DRAFT,
          PENDING_REVIEW,
          NEEDS_CHANGES,
          APPROVED,
          PUBLISHED,
          FUNDED,
          PAUSED,
          REJECTED,
          COMPLETED,
          REPORTED,
          ARCHIVED,
        ]
    CampaignCategory:
      type: string
      description: |
        The spec's seven groups. Stored at group level — the spec's leaf
        examples ("Flood", "Fire") are description detail, not taxonomy.
      enum:
        [
          EMERGENCY_RELIEF,
          COMMUNITY_DEVELOPMENT,
          EDUCATION,
          HEALTHCARE,
          ENVIRONMENT,
          AGRICULTURE,
          OTHER,
        ]
    MilestoneStatus:
      type: string
      enum: [PLANNED, IN_PROGRESS, COMPLETED]
    ReconciliationReport:
      type: object
      description: |
        The outcome of one reconciliation run. `drift` being empty is the
        only thing that means "our ledger and Paystack agree".
      properties:
        id:
          type: string
          format: uuid
          description: Identifies this run. Used as the audit row's target and in log lines.
        ranAt: { type: string, format: date-time, description: UTC. }
        durationMs: { type: integer }
        pendingChecked: { type: integer }
        settledChecked: { type: integer }
        recovered:
          type: integer
          description: Payments Paystack had that no webhook ever settled, now repaired.
        recoveredMinor:
          type: integer
          format: int64
          description: |
            Money, in integer minor units, that would have been lost had this
            run not happened. The most useful number in the report.
        markedFailed: { type: integer }
        markedAbandoned: { type: integer }
        stillPending: { type: integer }
        receiptsSent:
          type: integer
          description: |
            Donors who had settled without ever receiving a receipt and have
            now been emailed. Non-zero means the inline send failed earlier
            — worth noticing even though the donor has since been told.
        receiptsFailed: { type: integer }
        drift:
          type: array
          items: { $ref: '#/components/schemas/ReconciliationDrift' }

    ReconciliationDrift:
      type: object
      description: One disagreement between the ledger and Paystack.
      properties:
        donationId: { type: string, format: uuid }
        campaignId: { type: string, format: uuid }
        reference: { type: string }
        amountMinor: { type: integer, format: int64 }
        detail: { type: string }
        kind:
          type: string
          description: |
            - `RECOVERED_MISSED_WEBHOOK` — repaired, but the webhook failed.
            - `AMOUNT_MISMATCH` — we banked a different figure than Paystack holds. Public totals are wrong.
            - `CURRENCY_MISMATCH` — currencies disagree.
            - `SUBACCOUNT_MISMATCH` — the payment credited a different organization. Money reached the wrong people.
            - `SETTLED_HERE_BUT_NOT_AT_PROVIDER` — we show settled, Paystack does not. A missed reversal or a ledger bug.
            - `PENDING_WITH_MISMATCHED_DETAILS` — reported successful but the details do not match the intent, so it was NOT settled.
            - `PROVIDER_UNREACHABLE` — the row could not be checked at all. Not evidence of a problem, but not evidence of health either.
          enum:
            - RECOVERED_MISSED_WEBHOOK
            - AMOUNT_MISMATCH
            - CURRENCY_MISMATCH
            - SUBACCOUNT_MISMATCH
            - SETTLED_HERE_BUT_NOT_AT_PROVIDER
            - PENDING_WITH_MISMATCHED_DETAILS
            - PROVIDER_UNREACHABLE

    ReconciliationFinding:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          description: A DriftKind — see the reconcile endpoint for the full list.
        donationId: { type: string, format: uuid }
        campaignId: { type: string, format: uuid, nullable: true }
        reference: { type: string, nullable: true }
        amountMinor: { type: integer, format: int64 }
        detail: { type: string }
        runId:
          type: string
          format: uuid
          nullable: true
          description: The sweep that most recently saw this, for tracing back to its log lines.
        firstSeenAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        timesSeen:
          type: integer
          description: How many sweeps have found this same unresolved problem.
        resolvedAt: { type: string, format: date-time, nullable: true }
        resolvedByName: { type: string, nullable: true }
        resolutionNote: { type: string, nullable: true }

    PublicFinalReport:
      type: object
      description: |
        The organization's closing account, present only once filed.
      properties:
        body: { type: string }
        attachmentUrls:
          type: array
          items: { type: string }
        reportedAt: { type: string, format: date-time }
        unaccountedMinor:
          type: integer
          format: int64
          description: |
            What was still unexplained **when this was filed** — not now.
            Publishing the live figure would let spend recorded afterwards
            make an incomplete report look complete in hindsight.
        fullyAccounted:
          type: boolean
          description: |
            The verdict in one field, so a client does not re-derive it and
            reach a different answer than the page beside it.

    PublicSpend:
      type: object
      description: |
        One line of the organization's own account of its spending. An
        explicit allow-list rather than the stored model, matching
        PublicCampaign — new internal fields stay private until somebody
        deliberately publishes them.
      properties:
        id: { type: string, format: uuid }
        milestoneId:
          type: string
          format: uuid
          description: The part of the published plan this was spent on.
        amountMinor: { type: integer, format: int64 }
        currency: { type: string }
        description: { type: string }
        spentAt:
          type: string
          format: date-time
          description: When the money left the organization. UTC.
        receiptUrl: { type: string, nullable: true }
        publishedBy:
          type: string
          description: |
            The person's NAME, not their user id. Attribution is for
            readers; exposing ids invites correlation across surfaces.
        publishedAt: { type: string, format: date-time }

    SpendSummary:
      type: object
      description: |
        Campaign-level accounting, returned inside the public campaign
        detail.

        Note what is deliberately ABSENT: any single "remaining balance"
        figure. CivicOS does not hold the money and cannot know an
        organization's actual balance — only what came through this
        platform and what the organization says it spent. Presenting a
        derived balance as fact would be inventing a number.
      properties:
        reportedMinor:
          type: integer
          format: int64
          description: The organization's claim, summed. NOT verified.
        unreportedMinor:
          type: integer
          format: int64
          description: |
            Received minus reported, floored at zero — see
            `exceedsReceived`.
        exceedsReceived:
          type: boolean
          description: |
            The organization reports spending more than it raised here.
            Legitimate — they may have topped up from other funds — and
            surfaced rather than clamped, because silently capping it would
            make the arithmetic on the page fail to add up.
        recordCount: { type: integer }
        perMilestone:
          type: object
          additionalProperties: { type: integer, format: int64 }
          description: Reported total keyed by milestone id.

    DonationStatus:
      type: string
      description: |
        Only the webhook may move a donation to SETTLED. The browser redirect
        after payment is a hint, not proof — a donor can close the tab or
        craft the return URL. ABANDONED is kept distinct from FAILED so an
        intent that never completed is separable from one that actively
        failed.
      enum: [PENDING, SETTLED, FAILED, ABANDONED, REFUNDED]
    PauseReason:
      type: string
      description: |
        The five Governance triggers from the product spec, plus OTHER. A
        code rather than free text so pauses are countable and filterable —
        these are the grounds on which a live fundraiser is stopped. A
        free-text note is required alongside.
      enum:
        [
          FRAUD_DETECTED,
          VERIFICATION_EXPIRED,
          MISUSE_REPORTED,
          ORGANIZATION_SUSPENDED,
          FALSE_INFORMATION,
          OTHER,
        ]
    CampaignCurrency:
      type: string
      description: |
        ISO-4217. Allow-listed rather than free-form so Phase 3 cannot
        inherit campaigns denominated in a currency no payment provider can
        settle. Immutable after creation.
      enum: [NGN, GBP, USD, EUR]
      default: NGN

    Organization:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        kind: { $ref: '#/components/schemas/OrgKind' }
        jurisdiction: { $ref: '#/components/schemas/OrgJurisdiction' }
        representativeId:
          type: string
          format: uuid
          nullable: true
          description: |
            Set only on a REPRESENTATIVE_OFFICE — the profile whose holder
            owns this office. Unique where present: one office per
            representative.
        state: { type: string, nullable: true }
        lga: { type: string, nullable: true }
        description: { type: string, nullable: true }
        logoUrl: { type: string, nullable: true }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        website: { type: string, nullable: true }
        verified:
          {
            type: boolean,
            description: Citizen-facing trust badge; toggled by platform admins only.,
          }
        memberCount: { type: integer }
        announcementCount: { type: integer }
        projectCount: { type: integer }
        assignmentCount: { type: integer }
        createdById: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    OrgMember:
      type: object
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        userName: { type: string }
        userRole: { type: string, description: Platform role at time of add. }
        role: { $ref: '#/components/schemas/OrgMemberRole' }
        joinedAt: { type: string, format: date-time }

    Announcement:
      type: object
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        title: { type: string }
        body: { type: string }
        status: { $ref: '#/components/schemas/AnnouncementStatus' }
        publishedAt: { type: string, format: date-time, nullable: true }
        authorId: { type: string, format: uuid }
        authorName: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Project:
      type: object
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/ProjectStatus' }
        startDate: { type: string, format: date-time, nullable: true }
        expectedEndDate: { type: string, format: date-time, nullable: true }
        budgetKobo:
          type: integer
          format: int64
          nullable: true
          description: Budget in kobo (₦1 = 100 kobo).
        communityId: { type: string, format: uuid, nullable: true }
        createdById: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    IssueAssignment:
      type: object
      description: Records that an org has taken responsibility for a community-service Issue.
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        issueId:
          {
            type: string,
            format: uuid,
            description: Bare UUID reference — no FK across service boundary.,
          }
        status: { $ref: '#/components/schemas/AssignmentStatus' }
        note: { type: string, nullable: true }
        assignedById: { type: string, format: uuid }
        assignedByName: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ProgressUpdate:
      type: object
      description: |
        The "respond publicly" primitive. Each update belongs to one org
        and points at **exactly one** of an Issue (an assigned report), a
        Project, or — since Phase 4 — a Campaign. An update belonging to two
        at once would appear on both feeds saying different things to
        different audiences.

        Public updates are readable by anyone; internal notes are
        member-only.
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        issueId: { type: string, format: uuid, nullable: true }
        projectId: { type: string, format: uuid, nullable: true }
        campaignId:
          type: string
          format: uuid
          nullable: true
          description: Set when this is a funding update on a campaign.
        title:
          type: string
          nullable: true
          description: Optional. A funding feed reads better with headings.
        attachmentUrls:
          type: array
          items: { type: string }
          description: |
            Photographs, documents and financial reports. The spend plan is
            a promise; the photographs are the evidence.
        body: { type: string }
        isPublic: { type: boolean }
        authorId: { type: string, format: uuid }
        authorName: { type: string }
        createdAt: { type: string, format: date-time }

    ConsultationStatus:
      type: string
      enum: [DRAFT, PUBLISHED, CLOSED]

    QuestionType:
      type: string
      enum: [SHORT_TEXT, LONG_TEXT, SINGLE_CHOICE, MULTI_CHOICE, YES_NO]

    Consultation:
      type: object
      description: |
        A structured feedback ask published by an organization. `communityId`
        stored on the row is an audience label — it's shown to citizens but
        NOT enforced on response submission, so any verified user can answer.
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        communityId: { type: string, format: uuid, nullable: true }
        title: { type: string }
        summary: { type: string }
        description: { type: string, description: Markdown supported. }
        coverImageUrl: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/ConsultationStatus' }
        opensAt: { type: string, format: date-time, nullable: true }
        closesAt: { type: string, format: date-time, nullable: true }
        responseCount: { type: integer }
        authorId: { type: string, format: uuid }
        authorName: { type: string }
        publishedAt: { type: string, format: date-time, nullable: true }
        closedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ConsultationQuestion:
      type: object
      properties:
        id: { type: string, format: uuid }
        consultationId: { type: string, format: uuid }
        position: { type: integer }
        prompt: { type: string }
        helpText: { type: string, nullable: true }
        type: { $ref: '#/components/schemas/QuestionType' }
        options:
          type: array
          items: { type: string }
          description: Only used by SINGLE_CHOICE and MULTI_CHOICE questions.
        required: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ConsultationAnswer:
      type: object
      description: |
        A single question's answer inside a response. Exactly one of
        `textValue` or `selections` carries data based on question type.
        Yes/No answers are encoded as `selections: ["YES"]` or `["NO"]`.
      properties:
        id: { type: string, format: uuid }
        responseId: { type: string, format: uuid }
        questionId: { type: string, format: uuid }
        textValue: { type: string, nullable: true }
        selections:
          type: array
          items: { type: string }
          nullable: true

    ConsultationResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        consultationId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        submittedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    ConsultationOutcome:
      type: object
      description: |
        The "close the loop" primitive — after a consultation closes,
        the org publishes a summary of findings and what happens next.
        Exactly one outcome per consultation; POSTing a second time
        replaces the previous.
      properties:
        id: { type: string, format: uuid }
        consultationId: { type: string, format: uuid }
        summary: { type: string }
        decisions: { type: string }
        nextSteps: { type: string }
        authorId: { type: string, format: uuid }
        authorName: { type: string }
        publishedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ConsultationAggregate:
      type: object
      description: Per-question rollup returned by `/analytics`.
      properties:
        questionId: { type: string, format: uuid }
        prompt: { type: string }
        type: { $ref: '#/components/schemas/QuestionType' }
        answerCount: { type: integer }
        optionCounts:
          type: object
          additionalProperties: { type: integer }
          description: Populated for choice + Yes/No questions.
        textValues:
          type: array
          items: { type: string }
          description: Populated for text questions; capped at 100 samples.

paths:
  # ─────────────────────── ORGANIZATIONS ───────────────────────
  /organizations:
    get:
      tags: [Organizations]
      security: []
      summary: List organizations
      parameters:
        - in: query
          name: kind
          schema: { $ref: '#/components/schemas/OrgKind' }
        - in: query
          name: jurisdiction
          schema: { $ref: '#/components/schemas/OrgJurisdiction' }
        - in: query
          name: state
          schema: { type: string }
        - in: query
          name: lga
          schema: { type: string }
        - in: query
          name: q
          schema: { type: string }
      responses:
        '200':
          description: Organizations matching the filter.
          content:
            application/json:
              examples:
                default:
                  value:
                    success: true
                    data:
                      organizations:
                        - id: 9a8b7c6d-...
                          name: Enugu Water Corporation
                          slug: enugu-water-corp
                          kind: UTILITY
                          jurisdiction: STATE
                          state: Enugu
                          verified: true
                          memberCount: 12
                          projectCount: 4
                          assignmentCount: 27
                          createdById: 3f1a...
                          createdAt: 2026-06-01T09:00:00Z
                          updatedAt: 2026-06-01T09:00:00Z
    # No direct POST — organizations are only minted by approving an
    # `OrganizationApplication` in identity-service (see the applications
    # endpoints). Admins and org owners can still PATCH via
    # `/organizations/{id}` to fix data.

  /organizations/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Organizations]
      security: []
      summary: Get an organization
      responses:
        '200': { description: Organization detail. }
        '404':
          description: Not found.
          content:
            application/json:
              examples:
                default:
                  {
                    value: { success: false, code: ORG_NOT_FOUND, message: Organization not found },
                  }
    patch:
      tags: [Organizations]
      summary: Update an organization (org admin or PLATFORM_ADMIN)
      description: |
        All fields are optional. Toggling `verified` writes a distinct
        `org.verified` / `org.unverified` audit entry (separate from the
        plain `org.updated` action) because the verified badge is a
        citizen-facing trust signal.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                kind: { $ref: '#/components/schemas/OrgKind' }
                jurisdiction: { $ref: '#/components/schemas/OrgJurisdiction' }
                state: { type: string, nullable: true }
                lga: { type: string, nullable: true }
                description: { type: string, nullable: true }
                logoUrl: { type: string, nullable: true }
                email: { type: string, format: email, nullable: true }
                phone: { type: string, nullable: true }
                website: { type: string, format: uri, nullable: true }
                verified:
                  type: boolean
                  description: Platform admins only.
      responses:
        '200': { description: Updated organization. }

  # ────────────────────────── MEMBERS ──────────────────────────
  /organizations/{id}/members:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Members]
      security: []
      summary: List organization members
      responses:
        '200':
          description: Members.
          content:
            application/json:
              examples:
                default:
                  value:
                    success: true
                    data:
                      members:
