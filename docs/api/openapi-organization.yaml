        name: issueId
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Progress Updates]
      security: []
      summary: List public progress updates for an issue
      responses:
        '200':
          description: Progress updates.
          content:
            application/json:
              examples:
                default:
                  value:
                    success: true
                    data:
                      updates:
                        - id: p1u2p3d4-...
                          organizationId: 9a8b7c6d-...
                          issueId: 7f8e9d0c-...
                          body: Repairs completed. Water pressure restored.
                          isPublic: true
                          authorId: 3f1a...
                          authorName: Enugu Water Corp
                          createdAt: 2026-07-09T08:00:00Z

  /projects/{projectId}/progress-updates:
    parameters:
      - in: path
        name: projectId
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Progress Updates]
      security: []
      summary: List public progress updates for a project
      responses:
        '200': { description: Progress updates. }

  /organizations/{id}/progress-updates:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Progress Updates]
      summary: Post a progress update (org admin)
      description: Exactly one of `issueId` or `projectId` must be set — an update always hangs off either an assigned report or a project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                issueId: { type: string, format: uuid, nullable: true }
                projectId: { type: string, format: uuid, nullable: true }
                campaignId:
                  type: string
                  format: uuid
                  nullable: true
                  description: |
                    Publishes this as a funding update on a campaign.

                    **The campaign must belong to the organization in the
                    path.** Authorisation is checked against that org, while
                    this id arrives in the body — without the ownership check
                    an admin of one organization could publish updates onto
                    another organization's campaign page, under its name, to
                    its donors. A campaign owned by someone else returns 404,
                    not 403, so ids cannot be probed.
                title:
                  type: string
                  maxLength: 200
                  nullable: true
                attachmentUrls:
                  type: array
                  maxItems: 12
                  items: { type: string, format: uri }
                  description: Photographs, documents, financial reports.
                body: { type: string, minLength: 2 }
                isPublic: { type: boolean, default: true }
            examples:
              onIssue: { value: { issueId: 7f8e9d0c-..., body: Team dispatched, ETA 30 minutes. } }
              onProject:
                {
                  value:
                    { projectId: proj1a2b-..., body: Phase 1 complete — 400m of pipeline laid. },
                }
      responses:
        '201': { description: Update posted. }
        '400':
          description: Neither or both of issueId/projectId set.
          content:
            application/json:
              examples:
                default:
                  {
                    value:
                      {
                        success: false,
                        code: INVALID_TARGET,
                        message: Set exactly one of issueId or projectId,
                      },
                  }

  /progress-updates/{updateId}:
    parameters:
      - in: path
        name: updateId
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Progress Updates]
      summary: Delete a progress update (org admin)
      responses:
        '200': { description: Deleted. }
        '404':
          description: Not found.
          content:
            application/json:
              examples:
                default:
                  {
                    value:
                      {
                        success: false,
                        code: UPDATE_NOT_FOUND,
                        message: Progress update not found,
                      },
                  }

  # ─────────────────────── CONSULTATIONS ────────────────────────
  /consultations:
    get:
      tags: [Consultations]
      security: []
      summary: List consultations
      description: |
        Public list. Filter by organization, community, or status. Drafts
        are visible via the API but the citizen frontend hides them from
        non-members.
      parameters:
        - in: query
          name: organizationId
          schema: { type: string, format: uuid }
        - in: query
          name: communityId
          schema: { type: string, format: uuid }
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/ConsultationStatus' }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
        - in: query
          name: offset
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: List of consultations.
          content:
            application/json:
              examples:
                default:
                  value:
                    success: true
                    data:
                      consultations:
                        - id: c1a2b3c4-5678-90ab-cdef-1234567890ab
                          organizationId: 9a8b7c6d-1111-2222-3333-444455556666
                          communityId: 6f2a1c4d-9b3e-4a1f-8c7d-2b3e4f5a6b7c
                          title: National Curriculum Review
                          summary: How should the syllabus change for 2027?
                          description: Full context in markdown.
                          status: PUBLISHED
                          responseCount: 142
                          authorId: 3f1a...
                          authorName: Ada Admin
                          publishedAt: 2026-07-09T10:00:00Z
                          createdAt: 2026-07-08T14:22:00Z
                          updatedAt: 2026-07-09T10:00:00Z

  /consultations/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Consultations]
      security: []
      summary: Get a consultation by ID
      responses:
        '200':
          description: Consultation detail.
        '404':
          description: Not found.
          content:
            application/json:
              examples:
                default:
                  {
                    value:
                      {
                        success: false,
                        code: CONSULTATION_NOT_FOUND,
                        message: Consultation not found,
                      },
                  }
    patch:
      tags: [Consultations]
      summary: Edit a draft consultation (org admin)
      description: |
        Edits are DRAFT-only. Once published, the record is frozen so
        earlier and later responders answer the same questions.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, minLength: 5, maxLength: 200 }
                summary: { type: string, minLength: 10, maxLength: 500 }
                description: { type: string, minLength: 10 }
                coverImageUrl: { type: string, nullable: true }
                communityId: { type: string, format: uuid, nullable: true }
                opensAt: { type: string, format: date-time, nullable: true }
                closesAt: { type: string, format: date-time, nullable: true }
      responses:
        '200': { description: Updated. }
        '409':
          description: Not a draft.
          content:
            application/json:
              examples:
                default:
                  { value: { success: false, code: NOT_DRAFT, message: Only drafts can be edited } }
    delete:
      tags: [Consultations]
      summary: Delete a draft consultation (org admin)
      description: DRAFT-only. Once published, the record must survive.
      responses:
        '200': { description: Deleted. }
        '409': { description: Not a draft. }

  /organizations/{id}/consultations:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Consultations]
      summary: Create a new consultation as DRAFT (org admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, summary, description]
              properties:
                title: { type: string, minLength: 5, maxLength: 200 }
                summary: { type: string, minLength: 10, maxLength: 500 }
                description: { type: string, minLength: 10 }
                coverImageUrl: { type: string, nullable: true }
                communityId: { type: string, format: uuid, nullable: true }
                opensAt: { type: string, format: date-time, nullable: true }
                closesAt: { type: string, format: date-time, nullable: true }
            examples:
              default:
                value:
                  title: National Curriculum Review
                  summary: How should the syllabus change for 2027?
                  description: We are collecting citizen input.
                  communityId: 6f2a1c4d-9b3e-4a1f-8c7d-2b3e4f5a6b7c
                  closesAt: 2026-09-30T23:59:59Z
      responses:
        '201':
          description: Created; status = DRAFT.

  /consultations/{id}/publish:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Consultations]
      summary: Publish a draft consultation (org admin)
      description: DRAFT → PUBLISHED. Rejects if the consultation has no questions.
      responses:
        '200':
          description: Published; org members notified.
        '400':
          description: No questions yet.
          content:
            application/json:
              examples:
                default:
                  {
                    value:
                      {
                        success: false,
                        code: NO_QUESTIONS,
                        message: Add at least one question before publishing,
                      },
                  }
        '409':
          description: Invalid transition.

  /consultations/{id}/close:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Consultations]
      summary: Close a published consultation (org admin OR platform admin)
      description: |
        PUBLISHED → CLOSED. Idempotent — closing a closed consultation is
        a no-op. Responders are notified so they can watch for the outcome.

        **Emergency lever.** This is the one consultation-lifecycle endpoint
        that a `PLATFORM_ADMIN` can invoke without being a member of the
        org. Every other write (create, edit, publish, delete, outcome) is
        strictly org-only. Platform-admin closes write an audit entry with
        the actor's identity.
      responses:
        '200': { description: Closed. }
        '409': { description: Invalid transition. }

  # ────────────────── CONSULTATION QUESTIONS ─────────────────
  /consultations/{id}/questions:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Consultation Questions]
      security: []
      summary: List questions in order
      responses:
        '200':
          description: Questions.
          content:
            application/json:
              examples:
                default:
                  value:
                    success: true
                    data:
                      questions:
                        - id: q1a2b3c4-...
                          consultationId: c1a2b3c4-...
                          position: 1
                          prompt: Which subjects deserve more focus?
                          type: MULTI_CHOICE
                          options: [Maths, Science, History, Civic Ed]
                          required: true
    post:
      tags: [Consultation Questions]
      summary: Add a question to a draft (org admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt, type]
              properties:
                prompt: { type: string, minLength: 3, maxLength: 500 }
                helpText: { type: string, nullable: true }
                type: { $ref: '#/components/schemas/QuestionType' }
                options:
                  type: array
                  items: { type: string }
                  description: Required for SINGLE_CHOICE and MULTI_CHOICE (min 2 items).
                required: { type: boolean, default: false }
                position: { type: integer, description: Omit to append at the end. }
      responses:
        '201': { description: Question created. }
        '400':
          description: Invalid type or missing options.
          content:
            application/json:
              examples:
                needsOptions:
                  {
                    value:
                      {
                        success: false,
                        code: OPTIONS_REQUIRED,
                        message: Choice questions need at least two options,
                      },
                  }

  /consultations/{id}/questions/reorder:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Consultation Questions]
      summary: Bulk-reorder questions (org admin, DRAFT only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ordering]
              properties:
                ordering:
                  type: object
                  additionalProperties: { type: integer }
                  description: Map of questionId → new zero-based position.
            examples:
              default:
                value:
                  ordering:
                    q1a2b3c4-...: 0
                    q5f6e7d8-...: 1
                    q9c8b7a6-...: 2
      responses:
        '200': { description: Reordered. }

  /consultation-questions/{questionId}:
    parameters:
      - in: path
        name: questionId
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Consultation Questions]
      summary: Update a question (org admin, DRAFT only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt, type]
              properties:
                prompt: { type: string, minLength: 3, maxLength: 500 }
                helpText: { type: string, nullable: true }
                type: { $ref: '#/components/schemas/QuestionType' }
                options:
                  type: array
                  items: { type: string }
                required: { type: boolean }
                position: { type: integer }
      responses:
        '200': { description: Updated. }
    delete:
      tags: [Consultation Questions]
      summary: Delete a question (org admin, DRAFT only)
      responses:
        '200': { description: Deleted. }

  # ────────────────── CONSULTATION RESPONSES ─────────────────
  /consultations/{id}/responses:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Consultation Responses]
      summary: Submit a response (verified user)
      description: |
        One response per user is enforced by a compound unique index on
        `(consultation_id, user_id)`. Community-scoped consultations do
        NOT gate submission — any verified user can respond regardless
        of community membership. The community label is informational.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [questionId]
                    properties:
                      questionId: { type: string, format: uuid }
                      textValue:
                        type: string
                        nullable: true
                        description: For SHORT_TEXT and LONG_TEXT questions.
                      selections:
                        type: array
                        items: { type: string }
                        description: For SINGLE_CHOICE, MULTI_CHOICE, YES_NO questions. Yes/No is encoded as ["YES"] or ["NO"].
            examples:
              default:
                value:
                  answers:
                    - questionId: q1a2b3c4-...
                      selections: [YES]
                    - questionId: q2a2b3c4-...
                      selections: [Civic Ed, Science]
                    - questionId: q3a2b3c4-...
                      textValue: We should teach civics from primary school.
      responses:
        '201':
          description: Response recorded.
        '409':
          description: Consultation not accepting responses, closed, or already responded.
          content:
            application/json:
              examples:
                alreadyResponded:
                  {
                    value:
                      {
                        success: false,
                        code: ALREADY_RESPONDED,
                        message: You've already responded to this consultation,
                      },
                  }
                notAccepting:
                  {
                    value:
                      {
                        success: false,
                        code: NOT_ACCEPTING_RESPONSES,
                        message: This consultation isn't accepting responses,
                      },
                  }
                pastDeadline:
                  {
                    value:
                      { success: false, code: PAST_DEADLINE, message: Response window has closed },
                  }
        '400':
          description: Missing required answer, unknown question, or unknown option.
          content:
            application/json:
              examples:
                requiredUnanswered:
                  {
                    value:
                      {
                        success: false,
                        code: REQUIRED_UNANSWERED,
                        message: One or more required questions were not answered,
                      },
                  }
                unknownOption:
                  {
                    value:
                      {
                        success: false,
                        code: UNKNOWN_OPTION,
                        message: Selected option is not on the question,
                      },
                  }
    get:
      tags: [Consultation Responses]
      summary: List submitted responses (org admin)
      description: Members-only. Returns each response with its answers grouped.
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Responses.

  /consultations/{id}/analytics:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Consultation Responses]
      summary: Per-question aggregated analytics (org admin)
      description: |
        For choice questions returns option-count histograms. For text
        questions returns up to 100 sample text values. Large consultations
        will get a proper SQL rollup in a future revision.
      responses:
        '200':
          description: Aggregates.
          content:
            application/json:
              examples:
                default:
                  value:
                    success: true
                    data:
                      consultation:
                        id: c1a2b3c4-...
                        title: National Curriculum Review
                        status: CLOSED
                      responseCount: 142
                      questions:
                        - questionId: q1a2b3c4-...
                          prompt: Do you agree with the current syllabus?
                          type: YES_NO
                          answerCount: 142
                          optionCounts: { YES: 47, NO: 95 }
                        - questionId: q2a2b3c4-...
                          prompt: Which subjects deserve more focus?
                          type: MULTI_CHOICE
                          answerCount: 142
                          optionCounts: { Civic Ed: 88, Science: 62, Maths: 51, History: 22 }

  /me/representative-office:
    post:
      tags: [Organizations]
      summary: Fetch or create the caller's constituency office
      description: |
        Returns the calling representative's constituency office, creating
        it on the first call.

        An elected representative publishes campaigns, projects,
        consultations and announcements through an organization of kind
        `REPRESENTATIVE_OFFICE`. Once this returns, the caller is its
        `OWNER`, so every `/organizations/{id}/*` endpoint works for them
        unchanged — there is no representative-specific variant of any of
        them, and the donation path is untouched.

        Idempotent: safe to call whenever a representative opens their
        dashboard. A unique index on `representative_id` settles concurrent
        calls, and the loser returns the office that won rather than an
        error.

        The office is created **unverified with no payout account**, exactly
        as a newly registered organization is. This grants drafting, not
        money: `FundingEligible` must still pass before a campaign can leave
        review, which needs a platform admin. The one substitution for an
        office is that a claimed representative profile stands in for a
        registration number — an elected office has no entry in a company
        register. Every other funding requirement is identical.
      responses:
        '200':
          description: The caller's office, created or existing.
          content:
            application/json:
              examples:
                default:
                  value:
                    success: true
                    data:
                      organization:
                        id: 9d2f1a3b-4c5d-4e6f-8a9b-0c1d2e3f4a5b
                        name: Office of Senator Ada Okafor
                        slug: office-of-senator-ada-okafor-9d2f1a3b
                        kind: REPRESENTATIVE_OFFICE
                        jurisdiction: NATIONAL
                        representativeId: 3f1a2b3c-4d5e-4f6a-8b9c-0d1e2f3a4b5c
                        state: Enugu
                        lga: Enugu East
                        verified: false
        '403':
          description: '`NOT_A_REPRESENTATIVE` — the caller is not an approved representative.'
        '409':
          description: |
            `REPRESENTATIVE_UNCLAIMED` — the account is a representative but
            no profile names it as the holder. A platform admin must link it
            via `POST /representatives/{id}/claim` in community-service.

  /me/consultations/responses:
    get:
      tags: [Consultation Responses]
      summary: Which consultations has the caller responded to
      description: |
        Returned so the citizen frontend can mark "you've participated"
        in list views and prevent double-answer attempts before the
        server round-trip.
      responses:
        '200':
          description: List of consultation IDs the caller has responded to.
          content:
            application/json:
              examples:
                default:
                  value:
                    success: true
                    data:
                      consultationIds: [c1a2b3c4-..., c9a8b7c6-...]

  # ────────────────── CONSULTATION OUTCOMES ─────────────────
  /consultations/{id}/outcome:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Consultation Outcomes]
      security: []
      summary: Get the published outcome
      responses:
        '200': { description: Outcome. }
        '404':
          description: No outcome has been published yet.
          content:
            application/json:
              examples:
                default:
                  {
                    value:
                      {
                        success: false,
                        code: OUTCOME_NOT_FOUND,
                        message: No outcome has been published yet,
                      },
                  }
    post:
      tags: [Consultation Outcomes]
      summary: Publish or update the outcome (org admin, CLOSED only)
      description: |
        The "close the loop" primitive. Requires the consultation to be
        CLOSED. Idempotent — POSTing again overwrites the previous
        outcome. Every responder is notified when the outcome is
        published.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [summary, decisions, nextSteps]
              properties:
                summary: { type: string, minLength: 10 }
                decisions: { type: string, minLength: 10 }
                nextSteps: { type: string, minLength: 10 }
            examples:
              default:
                value:
                  summary: The community wants more civic education.
                  decisions: We will introduce weekly civic ed classes for grades 4-9.
                  nextSteps: Rollout begins Q3 2027 with a teacher training programme in Q2.
      responses:
        '201':
          description: Outcome published; responders notified.
        '409':
          description: Consultation isn't closed yet.
          content:
            application/json:
              examples:
                default:
                  {
                    value:
                      {
                        success: false,
                        code: NOT_CLOSED,
                        message: Close the consultation before publishing an outcome,
                      },
                  }

  # ─────────────────────── CAMPAIGNS (Community Funding, Phase 1) ───────────────────────
  # Every route below requires auth. Reads need membership of the owning org
  # (any role, incl. STAFF) or PLATFORM_ADMIN; writes need OWNER/ADMIN.
  # The public campaign surface arrives in Phase 4 with the transparency
  # dashboard, so a campaign cannot become publicly visible before there is
  # somewhere to show where its money went.

  /organizations/{id}/campaigns:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Campaigns]
      summary: List an organization's campaigns (members only)
      description: |
        Members-only, including drafts and rejected campaigns. Uses the
        member-read check rather than the admin check so STAFF can see the
        org's campaigns without being able to change them.
      parameters:
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/CampaignStatus' }
        - in: query
          name: category
          schema: { $ref: '#/components/schemas/CampaignCategory' }
      responses:
        '200': { description: Campaigns. }
        '403': { description: Not a member of this organization. }
    post:
      tags: [Campaigns]
      summary: Create a campaign draft (org admin)
      description: |
        Always created as DRAFT. The organization does **not** need to be
        verified to draft — verification is checked at submit time, so an org
        can prepare a campaign while its verification is still pending.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, summary, description, category, goalMinor]
              properties:
                title: { type: string, minLength: 4, maxLength: 160 }
                summary: { type: string, minLength: 10, maxLength: 300 }
                description: { type: string, minLength: 40 }
                category: { $ref: '#/components/schemas/CampaignCategory' }
                currency: { $ref: '#/components/schemas/CampaignCurrency' }
                goalMinor:
                  type: integer
                  format: int64
                  minimum: 1
                  description: |
                    Funding goal in the currency's **minor units** (kobo for
                    NGN, pence for GBP). Integer, never a decimal — binary
                    floats cannot represent 0.01 exactly and rounding drift
                    on money is a defect.
                coverImageUrl: { type: string, nullable: true }
                communityId: { type: string, format: uuid, nullable: true }
                projectId:
                  type: string
                  format: uuid
                  nullable: true
                  description: Links an existing Project so it becomes a fundable initiative.
                state: { type: string, nullable: true }
                lga: { type: string, nullable: true }
                startDate: { type: string, format: date-time, nullable: true }
                endDate: { type: string, format: date-time, nullable: true }
                isEmergency:
                  type: boolean
                  default: false
                  description: |
                    Marks the campaign for the platform's fast review queue.
                    Does not relax any verification requirement.
            examples:
              default:
                value:
                  title: Solar streetlights for Otukpo market road
                  summary: Replace the failed lighting along the market approach road.
                  description: The market road has had no working streetlights since March. Traders leaving after dark have been robbed on the unlit stretch between the motor park and the main gate.
                  category: COMMUNITY_DEVELOPMENT
                  currency: NGN
                  goalMinor: 15000000
                  state: Benue
                  lga: Otukpo
      responses:
        '201': { description: Campaign created as DRAFT. }
        '400':
          description: Validation failed.
          content:
            application/json:
              examples:
                invalidGoal:
                  {
                    value:
                      {
                        success: false,
                        code: INVALID_GOAL,
                        message: Funding goal must be greater than zero,
                      },
                  }
                unsupportedCurrency:
                  {
                    value:
                      {
                        success: false,
                        code: UNSUPPORTED_CURRENCY,
                        message: Campaign currency is not supported,
                      },
                  }
                invalidCategory:
                  {
                    value:
                      {
                        success: false,
                        code: INVALID_CATEGORY,
                        message: Unknown campaign category,
                      },
                  }
        '403': { description: Not an owner/admin of this organization. }

  /campaigns/{campaignId}:
    parameters:
      - in: path
        name: campaignId
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Campaigns]
      summary: Get a campaign (members only)
      responses:
        '200': { description: Campaign detail. }
        '404':
          description: Not found.
          content:
            application/json:
              examples:
                default:
                  {
                    value:
                      { success: false, code: CAMPAIGN_NOT_FOUND, message: Campaign not found },
                  }
    patch:
      tags: [Campaigns]
      summary: Update a campaign (org admin, DRAFT or NEEDS_CHANGES only)
      description: |
        Content is frozen once the campaign enters review: a donor who reads
        a campaign and gives money must be giving to the thing they read.

        `currency` and `status` are deliberately not editable here — currency
        is immutable after creation, and status moves only through the
        guarded lifecycle endpoints so no PATCH body can skip review.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                summary: { type: string }
                description: { type: string }
                category: { $ref: '#/components/schemas/CampaignCategory' }
                goalMinor: { type: integer, format: int64 }
                coverImageUrl: { type: string, nullable: true }
                communityId: { type: string, format: uuid, nullable: true }
                projectId: { type: string, format: uuid, nullable: true }
                state: { type: string, nullable: true }
                lga: { type: string, nullable: true }
                startDate: { type: string, format: date-time, nullable: true }
                endDate: { type: string, format: date-time, nullable: true }
                isEmergency: { type: boolean }
      responses:
        '200': { description: Updated campaign. }
        '409':
          description: Campaign is no longer editable.
          content:
            application/json:
              examples:
                default:
                  {
                    value:
                      {
                        success: false,
                        code: CAMPAIGN_NOT_EDITABLE,
                        message: Only draft campaigns or ones sent back for changes can be edited,
                      },
                  }
    delete:
      tags: [Campaigns]
      summary: Delete a campaign (org admin, DRAFT only)
      description: |
        Anything that has been through review is part of the public record of
        what this organization asked for, and is archived rather than deleted.
      responses:
        '200': { description: Deleted. }
        '409':
          description: Only drafts can be deleted.
          content:
            application/json:
              examples:
                default:
                  {
                    value:
                      {
                        success: false,
                        code: CAMPAIGN_NOT_DELETABLE,
                        message: Only draft campaigns can be deleted; submitted campaigns are archived instead,
                      },
                  }

  /campaigns/{campaignId}/submit:
    parameters:
      - in: path
        name: campaignId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Campaigns]
      summary: Submit for verification review (org admin)
      description: |
        DRAFT | NEEDS_CHANGES → PENDING_REVIEW. This is the gate the spec's
        "Trust First" principle lives behind, so all three checks are
        server-side:

        1. the owning organization must be **funding eligible** — verified,
           plus registration number, country, official email, a named
           representative and bank-account verification (see
           `GET /organizations/{id}/funding-eligibility`)
        2. there must be **at least one milestone** (a spend plan)
        3. milestone targets must **not exceed the goal**

        Also clears any previous reviewer verdict so the queue shows a fresh
        decision rather than a stale "needs changes" note.
      responses:
        '200': { description: Campaign is now PENDING_REVIEW. }
        '400':
          description: Not ready for review.
          content:
            application/json:
              examples:
                noMilestones:
                  {
                    value:
                      {
                        success: false,
                        code: NO_MILESTONES,
                        message: Add at least one milestone describing how the funds will be spent,
                      },
                  }
                exceedsGoal:
                  {
                    value:
                      {
                        success: false,
                        code: MILESTONES_EXCEED_GOAL,
                        message: Milestone targets add up to more than the funding goal,
                      },
                  }
        '409':
          description: Organization not verified, or campaign is not in a submittable state.
          content:
            application/json:
              examples:
                notEligible:
                  {
                    value:
                      {
                        success: false,
                        code: ORG_NOT_FUNDING_ELIGIBLE,
                        message: 'Your organization cannot raise funds yet — still needed: registration number, bank account verification',
                      },
                  }
                badTransition:
                  {
                    value:
                      {
                        success: false,
                        code: CAMPAIGN_INVALID_TRANSITION,
                        message: Cannot move a campaign from PUBLISHED to PENDING_REVIEW,
                      },
                  }

  /campaigns/{campaignId}/publish:
    parameters:
      - in: path
        name: campaignId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Campaigns]
      summary: Publish an approved campaign (org admin)
      description: |
        APPROVED → PUBLISHED. Approval is permission to publish, not
        publication — the org chooses the moment, which matters for an
        emergency campaign launching alongside an announcement.
      responses:
        '200': { description: Campaign is now PUBLISHED. }
        '409': { description: Campaign is not APPROVED. }

  /campaigns/{campaignId}/complete:
    parameters:
      - in: path
        name: campaignId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Campaigns]
      summary: Mark the work complete (org admin)
      description: PUBLISHED | FUNDED → COMPLETED.
      responses:
        '200': { description: Campaign is now COMPLETED. }
        '409': { description: Invalid transition. }

  /campaigns/{campaignId}/report:
    parameters:
      - in: path
        name: campaignId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Campaigns]
      summary: File the final report (org admin)
      description: |
        COMPLETED → REPORTED. The final report is the gate for archiving, so
        a campaign cannot be quietly retired without accounting for what it
        did.

        Until Phase 5 this was a bare status flip: an organization could mark
        a campaign reported having published nothing at all, which is the
        opposite of what the status is for. A report now has to say
        something.

        **Filing is deliberately NOT blocked when money is still unaccounted
        for.** Blocking would strand campaigns in `COMPLETED` and teach
        organizations that saying nothing is safer than saying something
        incomplete. Instead the shortfall at the moment of filing is recorded
        alongside the report, so an incomplete account is published as an
        incomplete account.

        That figure is a **snapshot, not a live number**. If it were
        recomputed, an organization could file with money unexplained,
        publish more spend a week later, and have the page retroactively
        agree the report was complete. Freezing it preserves what was true
        when the claim was made.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  minLength: 40
                  maxLength: 5000
                  description: What the campaign actually delivered.
                attachmentUrls:
                  type: array
                  maxItems: 12
                  items: { type: string, format: uri }
                  description: Evidence — photographs, receipts, a statement.
      responses:
        '200': { description: Report published; the campaign is now REPORTED. }
        '400': { description: REPORT_TOO_SHORT or VALIDATION_ERROR. }
        '403': { description: Not an admin of the owning organization. }
        '409':
          { description: CAMPAIGN_INVALID_TRANSITION — only a COMPLETED campaign can be reported. }

  # ─────────────────────── CAMPAIGN GOVERNANCE (platform admin) ───────────────────────

  /admin/campaigns:
    get:
      tags: [Campaigns]
      summary: Platform review queue (platform admin)
      description: Defaults to PENDING_REVIEW. `emergency=true` surfaces the fast path.
      parameters:
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/CampaignStatus' }
        - in: query
          name: category
          schema: { $ref: '#/components/schemas/CampaignCategory' }
        - in: query
          name: emergency
          schema: { type: boolean }
      responses:
        '200': { description: Campaigns awaiting review. }
        '403': { description: Platform admins only. }

  /campaigns/{campaignId}/review:
    parameters:
      - in: path
        name: campaignId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Campaigns]
      summary: Approve, request changes, or reject (platform admin)
      description: |
        PENDING_REVIEW → APPROVED | NEEDS_CHANGES | REJECTED. An organization
        cannot review its own campaign — "Trust First" is meaningless if the
        applicant can approve itself.

        A `note` is **required** for anything other than approval: telling an
        organization its flood-relief campaign is rejected without saying why
        is not a usable product.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [APPROVED, NEEDS_CHANGES, REJECTED] }
                note: { type: string, nullable: true }
            examples:
              needsChanges:
                value:
                  decision: NEEDS_CHANGES
                  note: Please attach the LGA works department quote for the transformer.
      responses:
        '200': { description: Reviewed campaign. }
        '400':
          description: Invalid decision, or missing note.
          content:
            application/json:
              examples:
                noteRequired:
                  {
                    value:
                      {
                        success: false,
                        code: REVIEW_NOTE_REQUIRED,
                        message: Explain what needs to change or why the campaign was rejected,
                      },
                  }
        '403': { description: Platform admins only. }

  /campaigns/{campaignId}/pause:
    parameters:
      - in: path
        name: campaignId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Campaigns]
      summary: Pause a live campaign (platform admin)
      description: |
        PUBLISHED | FUNDED → PAUSED. Covers the spec's Governance triggers:
        fraud detected, verification expired, misuse reported, organization
        suspended, false information identified. A reason is required and is
        written to the audit log.

        An org cannot pause its own campaign — that lever exists for
        oversight, not for dodging scrutiny.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reasonCode, note]
              properties:
                reasonCode: { $ref: '#/components/schemas/PauseReason' }
                note:
                  type: string
                  description: What specifically prompted the pause. Shown to the organization and written to the audit log.
            examples:
              default:
                value:
                  reasonCode: MISUSE_REPORTED
                  note: Two residents report the listed borehole site does not exist.
      responses:
        '200': { description: Campaign is now PAUSED. }
        '400':
          description: Unknown reason code, or missing note.
          content:
            application/json:
              examples:
                badCode:
                  {
                    value:
                      {
                        success: false,
                        code: INVALID_PAUSE_REASON,
                        message: Pause reason must be one of FRAUD_DETECTED,
                        ...,
                      },
                  }
                noNote:
                  {
                    value:
                      {
                        success: false,
                        code: PAUSE_NOTE_REQUIRED,
                        message: Record what specifically prompted this pause,
                      },
                  }
        '403': { description: Platform admins only. }

  /campaigns/{campaignId}/resume:
    parameters:
      - in: path
        name: campaignId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Campaigns]
      summary: Resume a paused campaign (platform admin)
      description: |
        PAUSED → PUBLISHED. Returns to PUBLISHED even if the goal was already
        met; the platform re-derives FUNDED from the donation ledger.
      responses:
        '200': { description: Campaign is live again. }
        '409': { description: Campaign is not PAUSED. }

  /campaigns/{campaignId}/archive:
    parameters:
      - in: path
        name: campaignId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Campaigns]
      summary: Archive a reported campaign (platform admin)
      description: REPORTED → ARCHIVED. Terminal.
      responses:
        '200': { description: Campaign is now ARCHIVED. }
        '409': { description: Final report not published yet. }

  # ─────────────────────── MILESTONES ───────────────────────

  /campaigns/{campaignId}/milestones:
    parameters:
      - in: path
        name: campaignId
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Milestones]
      summary: List a campaign's spend plan (members only)
      description: Ordered by `position`.
      responses:
        '200': { description: Milestones. }
    post:
      tags: [Milestones]
      summary: Add a milestone (org admin, DRAFT or NEEDS_CHANGES only)
      description: |
        Milestone targets may not add up to more than the campaign goal.
        Checked here as well as at submit time so the org sees the error
        while building the plan, not minutes later at the review gate.

        `position` defaults to the end of the list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, targetMinor]
              properties:
                title: { type: string, minLength: 3, maxLength: 160 }
                description: { type: string, nullable: true }
                targetMinor: { type: integer, format: int64, minimum: 1 }
                position: { type: integer, nullable: true }
            examples:
              default:
                value:
                  title: Purchase and deliver 40 solar units
                  description: Includes poles, fittings and installation labour.
                  targetMinor: 9000000
      responses:
        '201': { description: Milestone created. }
        '400':
          description: Invalid target, or the plan would exceed the goal.
          content:
            application/json:
              examples:
                exceedsGoal:
                  {
                    value:
                      {
                        success: false,
                        code: MILESTONES_EXCEED_GOAL,
                        message: Milestone targets would add up to more than the funding goal,
                      },
                  }
        '409':
          description: Campaign is no longer editable.

  /milestones/{milestoneId}:
    parameters:
      - in: path
        name: milestoneId
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Milestones]
      summary: Update a milestone (org admin)
      description: |
        Two different permissions in one endpoint, deliberately:

        - **Plan edits** (`title`, `description`, `targetMinor`, `position`)
          require the campaign to be DRAFT or NEEDS_CHANGES.
        - **`status`** is progress reporting and is allowed on a live
          campaign, because an org must be able to report a milestone done
          while the campaign is running.

        Setting status to COMPLETED stamps `completedAt`; moving it back
        clears the stamp rather than leaving a stale completion date.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string, nullable: true }
                targetMinor: { type: integer, format: int64 }
                position: { type: integer }
                status: { $ref: '#/components/schemas/MilestoneStatus' }
      responses:
        '200': { description: Updated milestone. }
        '400': { description: Invalid target or status. }
        '409': { description: Plan is frozen for this campaign status. }
    delete:
      tags: [Milestones]
      summary: Delete a milestone (org admin, DRAFT or NEEDS_CHANGES only)
      responses:
        '200': { description: Deleted. }
        '409': { description: Campaign is no longer editable. }

  # ─────────────────────── PUBLIC CAMPAIGNS (Phase 2) ───────────────────────
  # Unauthenticated. Returns a projection (not the domain model) that omits
  # the review trail — approvalStatus, reviewNote, reviewedById, submittedAt
  # and the free-text pause note are all withheld. See public.go.

  /campaigns:
    get:
      tags: [Campaigns]
      security: []
      summary: Browse published campaigns (public)
      description: |
        Only campaigns in a citizen-visible status are returned: PUBLISHED,
        FUNDED, COMPLETED, REPORTED. The allow-list lives in the repository so
        a status added later defaults to hidden.
      parameters:
        - in: query
          name: category
          schema: { $ref: '#/components/schemas/CampaignCategory' }
        - in: query
          name: organizationId
          schema: { type: string, format: uuid }
        - in: query
          name: communityId
          schema: { type: string, format: uuid }
        - in: query
          name: state
          schema: { type: string }
        - in: query
          name: lga
          schema: { type: string }
        - in: query
          name: emergency
          schema: { type: boolean }
        - in: query
          name: verified
          description: Restrict to campaigns run by a verified organization. Filters on the owning org, not the campaign.
          schema: { type: boolean }
        - in: query
          name: country
          description: Country of the owning organization. Matched case-insensitively.
          schema: { type: string }
        - in: query
          name: sort
          description: |
            `RECENT` (default) — newest first.
            `ENDING_SOON` — campaigns whose deadline is still ahead, soonest
            first. Ones already past their date, and ones with no date, sort to
            the END rather than being hidden: an expired deadline is not
            "ending soon", but the campaign may still be taking money.
            `MOST_FUNDED` — by amount raised, descending.
            `EMERGENCY` — emergency appeals first.
            `NEAR_ME` — closest first, using `nearState` / `nearLga`.

            An unrecognised value falls back to `RECENT` rather than erroring,
            so a typo cannot hand a citizen an empty page.
          schema:
            type: string
            enum: [RECENT, ENDING_SOON, MOST_FUNDED, EMERGENCY, NEAR_ME]
        - in: query
          name: nearState
          description: |
            Reference point for `sort=NEAR_ME`. Deliberately separate from the
            `state` filter: near-me ORDERS the whole list by closeness, it does
            not narrow it. Without a reference point NEAR_ME falls back to
            recency.
          schema: { type: string }
        - in: query
          name: nearLga
          description: Reference LGA for `sort=NEAR_ME`. Same-LGA campaigns rank above same-state.
          schema: { type: string }
      responses:
        '200': { description: Public campaign summaries. }

  /campaigns/slug/{slug}:
    parameters:
      - in: path
        name: slug
        required: true
        schema: { type: string }
    get:
      tags: [Campaigns]
      security: []
      summary: Read a published campaign by slug (public)
      description: |
        Returns the campaign plus its milestone spend plan — the Phase 2
        transparency surface: a citizen can see the goal and exactly how the
        money is meant to be spent, before the campaign can accept anything.

        Phase 4 adds a `spend` summary: what the campaign received through
        CivicOS alongside what the organization says it spent. Read the two
        differently — `raisedMinor` is ledger truth the platform observed,
        `spend` is an unverified claim the organization published, because
        donations settle straight to its own account. See `SpendSummary`.

        A campaign in a non-public status returns **404, not 403**. A 403
        would confirm that a campaign with that slug exists and is merely
        hidden, turning the slug into an oracle for drafts and rejected
        applications.
      responses:
        '200':
          description: |
            Public campaign detail with milestones and, when available, the
            reported-spend summary. `spend` is omitted if spend reporting is
            not wired on this deployment.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      campaign:
                        type: object
                        properties:
                          spend: { $ref: '#/components/schemas/SpendSummary' }
        '404':
          description: No published campaign with that slug.
          content:
            application/json:
              examples:
                default:
                  {
                    value:
                      { success: false, code: CAMPAIGN_NOT_FOUND, message: Campaign not found },
                  }

  # ─────────────────────── ORG FUNDING VERIFICATION (Phase 2) ───────────────────────

  /organizations/{id}/funding-verification:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Organizations]
      summary: Record bank-account verification (platform admin)
      description: |
        The platform's attestation that the organization's settlement account
        has been checked out-of-band.

        Deliberately **not** a field on `PATCH /organizations/{id}`: the
        paperwork fields (registration number, country, official email,
        representative, supporting document) are the org's own and org admins
        may edit them, but an organization that could self-certify its bank
        account would make the funding-eligibility gate decorative.

        Setting it to `false` also clears the reviewer stamp, so a revoked
        attestation cannot be mistaken for a current one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bankAccountVerified]
              properties:
                bankAccountVerified: { type: boolean }
      responses:
        '200': { description: Updated organization. }
        '403': { description: Platform admins only. }

  /organizations/{id}/funding-eligibility:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Organizations]
      summary: What is still outstanding before this org can raise funds (members + platform admin)
      description: |
        Returns the same verdict the campaign submit gate uses, so the admin
        console and the API can never disagree about what "eligible" means.
        `missing` names each gap in human-readable terms.
      responses:
        '200':
          description: Eligibility verdict.
          content:
            application/json:
              examples:
                notEligible:
                  {
                    value:
                      {
                        success: true,
                        data:
                          {
                            eligible: false,
                            missing: [registration number, bank account verification],
                          },
                      },
                  }
        '403': { description: Members of this organization or platform admins only. }

  # ─────────────────────── DONATIONS (Phase 3) ───────────────────────

  /campaigns/{campaignId}/donation-intents:
    parameters:
      - in: path
        name: campaignId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Donations]
      security: []
      summary: Start a donation (public, guests welcome)
      description: |
        Opens a Paystack transaction against the organization's sub-account
        and records a PENDING ledger row, returning a checkout URL.

        **No account required.** A donor should not have to sign up to help.
        If a session is present the donation is attributed to that user;
        otherwise it is a guest donation.

        The ledger row is written **before** the donor is sent to Paystack.
        Reversed, a donor could pay against a reference CivicOS has no record
        of — money would move with nothing to reconcile against.

        Only PUBLISHED and FUNDED campaigns accept donations. **PAUSED is
        excluded on purpose**: once funds settle straight to the organization,
        pausing is the only governance lever left, so it must actually stop
        new money.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountMinor, email, idempotencyKey]
              properties:
                amountMinor:
                  type: integer
                  format: int64
                  minimum: 1
                  description: Amount in minor units (kobo). Integer only.
                email:
                  type: string
                  format: email
                  description: Required by Paystack and used for the receipt. Never exposed publicly.
                donorName: { type: string, nullable: true }
                isAnonymous:
                  type: boolean
                  default: false
                  description: When true the public donor list shows "Anonymous" instead of the name.
                message: { type: string, nullable: true }
                idempotencyKey:
                  type: string
                  minLength: 8
                  maxLength: 100
                  description: |
                    Client-generated, unique per attempt. Carries a unique
                    index, so a double-tapped donate button cannot open two
                    transactions.
            examples:
              default:
                value:
                  amountMinor: 2000000
                  email: donor@example.com
                  donorName: Ada
                  isAnonymous: false
                  idempotencyKey: 8f2c1d90-6a4b-4c2e-9f11-2b7d5e0a3c44
      responses:
        '201':
          description: Intent created; send the donor to `authorizationUrl`.
          content:
            application/json:
              examples:
                default:
                  {
                    value:
                      {
                        success: true,
                        data:
                          {
                            donation:
                              {
                                authorizationUrl: https://checkout.paystack.com/xxxx,
                                reference: civicos_9f2b…,
                                amountMinor: 2000000,
                                platformFeeMinor: 50000,
                                netMinor: 1950000,
                                currency: NGN,
                              },
                          },
                      },
                  }
        '400': { description: Invalid amount or payload. }
        '409':
          description: Campaign cannot accept donations, org not eligible, or key reused.
          content:
            application/json:
              examples:
                notAccepting:
                  {
                    value:
                      {
                        success: false,
                        code: CAMPAIGN_NOT_ACCEPTING,
                        message: This campaign is not accepting donations,
                      },
                  }
                reusedKey:
                  {
                    value:
                      {
                        success: false,
                        code: DONATION_ALREADY_STARTED,
                        message: A donation with this key is already in progress,
                      },
                  }
        '502': { description: The payment provider refused the transaction. }
        '503':
          description: Donations are not enabled on this deployment (no Paystack key configured).

  /campaigns/{campaignId}/donations:
    parameters:
      - in: path
        name: campaignId
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Donations]
      security: []
      summary: Public donor list
      description: |
        Settled donations only. Returns a display name (or "Anonymous"), the
        amount, an optional message and the settlement time.

        Deliberately absent: donor email and user id. The transparency this
        feature exists for is about where the money goes, not who gave it.
      responses:
        '200': { description: Settled donations, newest first. }

  /organizations/{id}/psp-account:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Donations]
      summary: Connect the organization's payout account (org admin)
      description: |
        Creates a Paystack sub-account for the organization so Paystack can
        settle donations directly to its bank account.

        **The account number is not stored.** It is passed to Paystack once
        and only the returned sub-account code, the bank name and the last
        four digits are persisted — enough for an admin to recognise the
        account, and no more. Holding account numbers CivicOS has no further
        use for would be breach liability for nothing.

        A connected account is one of the requirements in
        `GET /organizations/{id}/funding-eligibility`: without it a campaign
        could publish and take money that has nowhere to settle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bankCode, accountNumber, businessName]
              properties:
                bankCode:
                  type: string
                  description: Paystack bank code (e.g. "057" for Zenith Bank).
                accountNumber: { type: string, minLength: 6, maxLength: 20 }
                businessName: { type: string, minLength: 2 }
                contactEmail: { type: string, format: email }
            examples:
              default:
                value:
                  bankCode: '057'
                  accountNumber: '0000000000'
                  businessName: Zaria Relief Trust
                  contactEmail: trust@zariarelief.ng
      responses:
        '200': { description: Organization with its connected payout account. }
        '403': { description: Not an owner/admin of this organization. }
        '502':
          description: The provider rejected the account details.
          content:
            application/json:
              examples:
                default:
                  {
                    value:
                      {
                        success: false,
                        code: PSP_SUBACCOUNT_FAILED,
                        message: Could not connect that account. Check the bank and account number.,
                      },
                  }

  /campaigns/{campaignId}/spend:
    get:
      tags: [Campaigns]
      security: []
      summary: What the organization says it spent (public)
      description: |
        **These figures are published by the organization, not verified by
        CivicOS.** Donations settle directly to the organization's own
        Paystack sub-account, so the platform never holds the money and
        cannot check a single line of this against a bank statement.

        That is a weaker guarantee than holding funds and releasing them
        against milestones, and it is the guarantee the merchant-of-record
        decision left in place. The design leans into it: every entry is
        tied to a milestone donors were shown before giving, dated,
        itemised and attributed to a named person, so the claim is
        *checkable by the people who paid* even though it is not
        enforceable by us.

        Unauthenticated on purpose — a donor answering "where did my money
        go?" should not need an account to find out.
      parameters:
        - in: path
          name: campaignId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Spend records, most recently spent first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      spend:
                        type: array
                        items: { $ref: '#/components/schemas/PublicSpend' }
    post:
      tags: [Campaigns]
      summary: Publish a spend record (org admin)
      description: |
        Records what the organization did with money raised through this
        campaign. Org admin only.

        Refused before the campaign is PUBLISHED — a campaign that never
        went live cannot have raised anything here, so spend against it
        describes something that did not happen through CivicOS.

        Deliberately still allowed while a campaign is PAUSED: pausing
        stops new donations, and an organization under investigation is
        exactly who should be accounting for what it already took.
      parameters:
        - in: path
          name: campaignId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [milestoneId, amountMinor, description, spentAt]
              properties:
                milestoneId:
                  type: string
                  format: uuid
                  description: |
                    Must belong to this campaign. Required: unattributed
                    spend is exactly the vagueness this feature exists to
                    remove.
                amountMinor:
                  type: integer
                  format: int64
                  description: Integer minor units (kobo). Never a float.
                description: { type: string, minLength: 3, maxLength: 2000 }
                spentAt:
                  type: string
                  description: |
                    When the money left the organization — not when this was
                    typed in. `YYYY-MM-DD` or RFC3339. A future date is
                    refused, or a typo could show a campaign's money
                    accounted for before it was spent.
                receiptUrl:
                  type: string
                  description: |
                    Optional evidence. Optional deliberately: requiring it
                    would push organizations with poor paperwork into
                    reporting nothing at all, and partial disclosure beats
                    silence.
      responses:
        '201': { description: Published. }
        '400': { description: VALIDATION_ERROR, INVALID_AMOUNT, or MILESTONE_MISMATCH. }
        '403': { description: Not an admin of the owning organization. }
        '404': { description: CAMPAIGN_NOT_FOUND or MILESTONE_NOT_FOUND. }
        '409': { description: CAMPAIGN_NOT_REPORTABLE — the campaign has never been published. }

  /spend/{spendId}:
    patch:
      tags: [Campaigns]
      summary: Amend a published spend record (org admin)
      description: |
        Every amendment is audited with the figure before and after. A
        published spend record is an accountability claim; letting an
        organization change one silently would let it rewrite what it told
        donors after the fact.
      parameters:
        - in: path
          name: spendId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amountMinor: { type: integer, format: int64 }
                description: { type: string }
                spentAt: { type: string }
                receiptUrl: { type: string }
      responses:
        '200': { description: Amended. }
        '403': { description: Not an admin of the owning organization. }
        '404': { description: SPEND_NOT_FOUND. }
    delete:
      tags: [Campaigns]
      summary: Withdraw a published spend record (org admin)
      description: |
        The record's full content is preserved in the audit entry —
        withdrawing a published claim is the most sensitive of these
        actions.
      parameters:
        - in: path
          name: spendId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Withdrawn. }
        '403': { description: Not an admin of the owning organization. }
        '404': { description: SPEND_NOT_FOUND. }

  /campaigns/{campaignId}/updates:
    get:
      tags: [Campaigns]
      security: []
      summary: Funding updates for a campaign (public)
      description: |
        The evidence half of the transparency page: what the organization
        says it has been doing, with photographs, documents and financial
        reports attached. Backed by the same `ProgressUpdate` model as
        issue and project updates, so it inherits their moderation and
        hide-filter behaviour.

        Only public updates are returned. Create these through
        `POST /organizations/{id}/progress-updates` with `campaignId` set.
      parameters:
        - in: path
          name: campaignId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Updates, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      updates:
                        type: array
                        items: { $ref: '#/components/schemas/ProgressUpdate' }

  /admin/donations/reconcile:
    post:
      tags: [Donations]
      summary: Reconcile the donation ledger against Paystack (platform admin)
      description: |
        Re-reads transactions directly from Paystack and compares them with
        our ledger. This is the safety net under the webhook.

        The webhook is the only thing that settles a donation, which makes it
        a single point of failure: a delivery that never arrives — or arrives
        while the endpoint is down — leaves money that genuinely moved
        sitting `PENDING` forever. Paystack retries, gives up, and nothing in
        the system notices. This endpoint is how we notice.

        The two sweeps have deliberately different powers:

        - **`PENDING` rows are repaired.** A donation Paystack reports as
          successful is settled through the ordinary settle path, exactly as
          the missed webhook would have. Safe because settlement is
          idempotent and because `PENDING` means nobody was told anything.
        - **`SETTLED` rows are only reported on.** If Paystack disagrees with
          money we already banked, that is for a human to look at, not for a
          background job to quietly rewrite. Auto-correcting settled money
          would destroy the audit trail that makes the discrepancy
          explicable.

        A repaired row is **still reported as drift** (`RECOVERED_MISSED_WEBHOOK`).
        The money ended up in the right place, but the delivery path failed
        and that needs explaining.

        `PLATFORM_ADMIN` only: a run can move a donation to `SETTLED`, which
        changes a campaign's public total. Every run is audited against its
        own generated run id.

        The same sweep runs on a timer (`RECONCILE_INTERVAL_MINUTES`); this
        endpoint exists so an admin chasing a specific complaint does not
        have to wait for the next tick.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                pendingGraceMinutes:
                  type: integer
                  description: |
                    How old a `PENDING` row must be before it is chased.
                    **Omit** for the default (20 minutes) — a donor may still
                    be on the Paystack checkout page, and writing off an
                    in-flight payment is worse than waiting. An explicit `0`
                    means "check everything now" and is honoured as such.
                settledWindowHours:
                  type: integer
                  description: How far back to re-check settled rows. Default 48.
                limit:
                  type: integer
                  description: Maximum rows per sweep. Default 500.
      responses:
        '200':
          description: The run completed. A 200 does NOT mean the ledger was clean — read `drift`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      report: { $ref: '#/components/schemas/ReconciliationReport' }
        '403': { description: Not a platform admin. }
        '503': { description: Donations are not enabled on this deployment (no Paystack key). }

  /admin/donations/drift:
    get:
      tags: [Donations]
      summary: Unresolved reconciliation drift (platform admin)
      description: |
        Donations where the ledger and Paystack disagree, recorded by the
        reconciliation sweep so they outlive the run that found them.

        Before this, findings went to the operator log and nowhere else — so
        drift discovered overnight waited for somebody to think to grep for
        it.

        A finding is a **problem, not an event**. The sweep re-detects every
        unresolved disagreement on each pass, so findings are unique per
        (donation, kind) and accumulate `timesSeen` rather than writing a row
        per detection, which would bury the finding that is new under repeats
        of one that is not.

        `RECOVERED_MISSED_WEBHOOK` is reported in the run but never filed
        here: the money was already banked correctly, and a permanently open
        finding for something already fixed trains admins to ignore the list.
      parameters:
        - in: query
          name: includeResolved
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Findings, most recently seen first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      openCount: { type: integer }
                      findings:
                        type: array
                        items: { $ref: '#/components/schemas/ReconciliationFinding' }
        '403': { description: Not a platform admin. }

  /admin/donations/drift/{findingId}/resolve:
    post:
      tags: [Donations]
      summary: Mark a finding handled (platform admin)
      description: |
        Resolution is deliberately manual. Drift that stops being detected
        may have been fixed, or may have become invisible, and only a person
        can say which — so nothing here clears itself.

        A finding that reappears after being resolved **re-opens**: drift that
        comes back is a regression, not history.
      parameters:
        - in: path
          name: findingId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note:
                  type: string
                  minLength: 4
                  maxLength: 1000
                  description: |
                    What was found and what was done. Required: "resolved"
                    with no explanation is indistinguishable from someone
                    clearing a list they did not read, and this is the audit
                    trail for money that did not reconcile.
      responses:
        '200': { description: Resolved, attributed and audited. }
        '400': { description: VALIDATION_ERROR — a note is required. }
        '403': { description: Not a platform admin. }
        '404': { description: FINDING_NOT_FOUND, or already resolved. }

  /webhooks/paystack:
    post:
      tags: [Donations]
      security: []
      summary: Paystack settlement callback (signature-authenticated)
      description: |
        **Unauthenticated by necessity, and must stay that way.** Paystack
        does not carry CivicOS JWTs; the request authenticates by an HMAC
        SHA-512 signature over the raw body in `x-paystack-signature`,
        verified inside organization-service. Putting auth middleware in
        front of this route would break settlement entirely.

        It is also deliberately **not rate-limited** at the gateway:
        throttling a payment provider's callbacks means dropping settlement
        events during exactly the traffic spike where they matter most.

        Behaviour worth knowing when reading logs:

        - A **valid signature proves origin, not content.** An event whose
          amount or currency disagrees with the opened intent is recorded,
          noted, and left **unsettled** for a human — never quietly banked.
        - Replays are a no-op. Deliveries are deduped on the provider's event
          id, and the campaign total is recomputed by SUM over settled rows
          rather than incremented, so repeats converge instead of inflating.
        - **Anything merely unactionable answers 200** — an unknown
          reference, a duplicate, an ignored event type. Paystack retries
          non-2xx, so returning an error for "nothing to do" buys a retry
          storm. Only a bad signature (401) and a genuine server fault (500)
          are non-2xx.
      parameters:
        - in: header
          name: x-paystack-signature
          required: true
          schema: { type: string }
          description: HMAC SHA-512 of the raw request body, keyed with the Paystack secret key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Raw Paystack event payload. The signature covers these exact bytes.
      responses:
        '200':
          {
            description: Received. Also returned for events that were understood but not actionable.,
          }
        '401':
          description: Signature verification failed. The attempt is recorded; nothing is applied.
          content:
            application/json:
              examples:
                default:
                  {
                    value:
                      {
                        success: false,
                        code: INVALID_SIGNATURE,
                        message: Signature verification failed,
                      },
                  }
        '500': { description: Server-side failure — Paystack should retry. }

  # ─────────────────────── FUNDING ANALYTICS ───────────────────────
  #
  # Two read-only endpoints. Nothing here writes, and nothing is cached — the
  # queries are cheap aggregates and a stale money figure is worse than a
  # slightly slower page.
  #
  # Every response carries a `notes` array. The caveats are in the PAYLOAD, not
  # only in this document, because these numbers get lifted into board packs
  # and funding applications, and the qualification has to travel with them.
  #
  # Two metrics from the product spec are deliberately absent rather than
  # approximated:
  #
  #   - "People helped" / "Beneficiaries reached" — nothing in the schema
  #     measures it. It could only be a number an organization typed in, which
  #     is a claim, and placing it beside ledger-derived figures would lend it
  #     a precision it has not earned.
  #   - "Funds withdrawn" / "Remaining balance" — CivicOS is not the merchant
  #     of record and never holds the money, so neither is knowable.

  /organizations/{id}/funding-analytics:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Funding Analytics]
      summary: Funding analytics for one organization.
      description: |
        Authorised by the same `CanReadInternal` gate as the organization's own
        campaign list, so an organization sees its own numbers and no one
        else's. Platform admins may read any.

        Covers the spec's Organisation Analytics list: funds raised, donation
        trends, repeat donors, average donation, campaign performance and
        completion rate.

        **Donor counts are a floor.** A donation made while signed out carries
        no user, so it cannot be tied to any other donation.
        `attributableDonations` is returned beside `uniqueDonors` and
        `repeatDonors` for exactly that reason — without it the counts read as
        complete when they are a lower bound.

        **`completionRate` is over campaigns that ever published**, not over
        all campaigns. A draft that never opened for donations cannot have
        failed to complete. **`reportingRate`** is over completed campaigns:
        the share of finished work that came with an account of the money.
      operationId: orgFundingAnalytics
      parameters:
        - in: query
          name: weeks
          description: Trend window. Clamped to 1–52; an unparseable value falls back to 12 rather than erroring.
          schema: { type: integer, default: 12, minimum: 1, maximum: 52 }
      responses:
        '200': { description: Analytics for the organization. }
        '403': { description: Caller may not read this organization. }

  /admin/funding-analytics:
    get:
      tags: [Funding Analytics]
      summary: Platform-wide funding analytics. Admin only.
      description: |
        `PLATFORM_ADMIN` only — this is money across every organization.

        Covers the spec's Platform Analytics list (total campaigns, total funds
        raised, verified organisations, countries, categories, emergency
        response metrics) and most of its Success Metrics.

        Notes on individual figures:

        - **`organizations.fundingEligible`** is stricter than `verified`: it
          also requires a connected payout account. The gap between the two is
          the onboarding drop-off.
        - **`emergency.medianHoursToFirstDonation`** is a median, not a mean —
          one appeal that sat unfunded for a month would drag an average far
          from the typical experience.
        - **`review.oldestWaitingHours`** is the number worth watching. An
          average wait stays comfortable while a single campaign sits for a
          fortnight.
        - **`trend`** includes empty weeks as zeros. A series that skipped them
          would let a chart draw a line straight through a silence.
        - Money is grouped **by currency**. Everything is NGN today and a
          campaign's currency is immutable after creation, so this is one entry
          in practice — but summing across currencies would be a defect the
          moment a second appears.
      operationId: platformFundingAnalytics
      parameters:
        - in: query
          name: weeks
          schema: { type: integer, default: 12, minimum: 1, maximum: 52 }
      responses:
        '200': { description: Platform-wide analytics. }
        '403': { description: Caller is not `PLATFORM_ADMIN`. }
